<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없어요 · NBA덩크시티-TNAB</title>
<link rel="icon" href="/assets/icon.png?v=1" type="image/png">
<script>
// GitHub Pages 가 없는 주소마다 이 파일을 준다. 카카오 사용자 정의 템플릿 링크 앞에 공백이 끼어
// /%20combos/ 처럼 들어온 주소는 공백을 떼고 원래 페이지로 — 이미 카톡방에 퍼진 카드도 열리게 둔다
try {
  const p = decodeURIComponent(location.pathname), fixed = p.replace(/^\/\s+/, '/')
  if (fixed !== p) location.replace(encodeURI(fixed) + location.search + location.hash)
} catch {}
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 12px; text-align: center; background: #0d1117; color: #e6edf3; font-family: system-ui, sans-serif; }
  a { color: #f5a623; }
</style>
</head>
<body>
<h1>페이지를 찾을 수 없어요</h1>
<p><a href="/">홈으로 가기</a></p>
</body>
</html>
