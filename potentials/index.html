<body>

<header class="top">
  <div class="brand">NBA 덩크 시티 <span>TNAB</span></div>
  <nav>
    <a href="/">홈</a>
    <a href="/tactics/">전술판</a>
    <a href="/tiers/">티어표</a>
    <a href="/potentials/">잠재력추천</a>
    <a href="/videos/">영상</a>
    <a href="/recruit/">팀원모집</a>
  </nav>
  <div class="spacer"></div>
  <div class="rc-auth" id="auth" aria-live="polite"></div>
</header>

<main class="recruit pt">

  <!-- 글 쓰기 · 고치기 — 로그인한 사람만 -->
  <section id="form-view" class="card rc-create" hidden>
    <form id="build-form" novalidate>
      <h2 id="form-title">빌드 작성</h2>
      <label class="rc-fld">
        <span>제목</span>
        <input type="text" name="title" maxlength="40" autocomplete="off" placeholder="예) 커리 3점 특화 빌드" required>
      </label>
      <fieldset>
        <legend>추천 캐릭터 <small>1~5명</small></legend>
        <div id="form-chars"></div>
      </fieldset>
      <label class="rc-fld">
        <span>어떤 상황에서 쓰면 좋은지</span>
        <textarea name="body" rows="4" maxlength="1000" placeholder="예) 외곽 슈터로 스페이싱할 때. 수비는 스위치가 많은 조합에서…"></textarea>
      </label>
      <fieldset>
        <legend>잠재력 <small>판에서 칸을 누르고 잠재력을 고르세요 · 전부 5레벨(MAX) · 한 색을 다 채우려면 「10칸 모두」</small></legend>
        <div id="form-slots"></div>
      </fieldset>
      <p class="rc-form-err" role="alert" hidden></p>
      <div class="rc-actions">
        <button type="button" id="form-cancel">취소</button>
        <button type="submit" class="primary rc-big">저장</button>
      </div>
    </form>
  </section>

  <!-- ?b 없음: 목록 -->
  <section id="list-view" hidden>
    <div class="rc-hero">
      <div>
        <h1>잠재력추천</h1>
        <p class="rc-lead">빨강 · 초록 · 파랑 30칸 잠재력 빌드를 캐릭터별로 모았어요. 좋은 빌드엔 추천을, 궁금한 건 댓글로 물어보세요.</p>
        <p class="rc-muted rc-need" id="need" hidden></p>
      </div>
      <button id="new" class="primary rc-big" type="button">+ 빌드 작성</button>
    </div>
    <div class="card pt-filter">
      <div class="pt-sort" role="group" aria-label="정렬">
        <button type="button" data-sort="likes">추천순</button>
        <button type="button" data-sort="new">최신순</button>
      </div>
      <div id="filter-chars"></div>
    </div>
    <div id="list" class="rc-list pt-list"></div>
  </section>

  <!-- ?b=<id>: 글 -->
  <section id="item-view" hidden>
    <a class="rc-back" href="/potentials/">← 목록</a>
    <p class="rc-form-err" id="item-error" hidden></p>
    <div id="item-body"></div>
  </section>

</main>

</body>
