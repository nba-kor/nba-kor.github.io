<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>티어표 · NBA 덩크 시티 한국 서버</title>
<meta name="description" content="NBA 덩크 시티 한국 서버 출시 선수 티어표. 선수를 드래그해서 나만의 티어를 만들고 링크로 공유하세요.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="top">
  <div class="brand">NBA 덩크 시티 <span>한국 서버</span></div>
  <nav>
    <a href="index.html">홈</a>
    <a href="tactics.html">전술판</a>
    <a href="tiers.html">티어표</a>
  </nav>
  <div class="spacer"></div>
  <div class="stamp"></div>
</header>

<main class="tiers">

  <div class="tier-head">
    <input class="title" id="title" value="내 티어표" aria-label="티어표 제목">
    <button id="add-row">+ 티어 추가</button>
    <button id="clear" class="danger">전부 내리기</button>
    <button id="reset" class="danger">초기화</button>
    <button id="share" class="primary">공유 링크</button>
  </div>

  <div class="tier-board" id="board"></div>

  <section class="pool" id="pool">
    <div class="filters" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px"></div>
    <div class="chips" id="pool-chips"></div>
    <p class="hint">선수를 티어 칸으로 끌어다 놓으세요. 다시 아래로 끌어내리면 목록으로 돌아갑니다. 순서도 드래그로 바꿀 수 있습니다.</p>
  </section>

</main>

<script type="module" src="assets/tiers.js"></script>
</body>
</html>
