<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>티어표 · NBA덩크시티-TNAB</title>
<meta name="description" content="NBA 덩크 시티 한국 서버 출시 선수 티어표. 선수를 드래그해 나만의 티어를 만들고 링크 하나로 공유하세요.">
<link rel="canonical" href="https://nba-kor.github.io/tiers/">
<link rel="icon" href="/assets/icon.png?v=1" type="image/png">
<link rel="apple-touch-icon" href="/assets/icon.png?v=1">
<meta name="theme-color" content="#0d1117">
<!-- 카카오톡 · 디스코드 · 트위터 미리보기. 이미지를 바꾸면 ?v= 도 올린다(카카오는 URL 로 캐시한다) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="NBA덩크시티-TNAB">
<meta property="og:locale" content="ko_KR">
<meta property="og:url" content="https://nba-kor.github.io/tiers/">
<meta property="og:title" content="티어표 · NBA덩크시티-TNAB">
<meta property="og:description" content="NBA 덩크 시티 한국 서버 출시 선수 티어표. 선수를 드래그해 나만의 티어를 만들고 링크 하나로 공유하세요.">
<meta property="og:image" content="https://nba-kor.github.io/assets/og.jpg?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="NBA덩크시티-TNAB — 3:3 전술판 · 티어표 · 팀원모집">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/assets/style.css?v=0d2f3d75">
</head>
<body>

<header class="top">
  <div class="brand">NBA 덩크 시티 <span>TNAB</span></div>
  <nav>
    <a href="/">홈</a>
    <a href="/tactics/">전술판</a>
    <a href="/tiers/">티어표</a>
    <a href="/potentials/">잠재력추천</a>
    <a href="/videos/">영상</a>
    <a href="/recruit/">팀원모집</a>
  </nav>
  <div class="spacer"></div>
  <div class="rc-auth" id="auth" aria-live="polite"></div>
</header>

<main>

<!-- 기본: 편집기 (?edit=<id> 면 내 글 고치기) -->
<section id="edit-view" class="tiers" hidden>

  <div class="tier-head">
    <input class="title" id="title" value="내 티어표" aria-label="티어표 제목">
    <button id="add-row">+ 티어 추가</button>
    <button id="clear" class="danger">전부 내리기</button>
    <button id="reset" class="danger">초기화</button>
    <button id="share">공유 링크</button>
    <button id="publish" class="primary">티어표 올리기</button>
    <a class="btn" href="/tiers/?list">모두의 티어표 →</a>
  </div>

  <form id="pub-form" class="card tier-pub" novalidate hidden>
    <label>제목 <input type="text" name="title" maxlength="40" autocomplete="off" required></label>
    <label>설명 <small>선택</small> <textarea name="body" rows="2" maxlength="500" placeholder="예) 솔로 랭크 기준, 3월 패치"></textarea></label>
    <p class="rc-form-err" role="alert" hidden></p>
    <div class="rc-actions">
      <button type="button" id="pub-cancel">취소</button>
      <button type="submit" class="primary">올리기</button>
    </div>
  </form>

  <div class="tier-board" id="board"></div>

  <section class="pool" id="pool">
    <div class="filters" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px"></div>
    <div class="chips" id="pool-chips"></div>
    <p class="hint">선수를 <b>누르면</b> 올릴 티어를 고를 수 있습니다(티어에 있는 선수를 누르면 다른 티어로 옮기거나 목록으로 내리기). PC 에서는 끌어다 놓아도 되고, 같은 티어 안의 순서는 드래그로 바꿉니다.</p>
  </section>

</section>

<div class="recruit pt">
  <!-- ?list: 모두가 올린 티어표 -->
  <section id="list-view" hidden>
    <div class="rc-hero">
      <div>
        <h1>모두의 티어표</h1>
        <p class="rc-lead">다른 사람들이 올린 티어표예요. 마음에 들면 추천 · 댓글을 남기고, 가져와서 내 티어표로 고칠 수도 있어요.</p>
        <p class="rc-muted rc-need" id="need" hidden></p>
      </div>
      <a class="btn primary rc-big" href="/tiers/">+ 내 티어표 만들기</a>
    </div>
    <div class="card pt-filter">
      <div class="pt-sort" role="group" aria-label="정렬">
        <button type="button" data-sort="new">최신순</button>
        <button type="button" data-sort="likes">추천순</button>
      </div>
      <div id="filter-chars" hidden></div>
    </div>
    <div id="list" class="rc-list pt-list"></div>
  </section>

  <!-- ?t=<id>: 글 -->
  <section id="item-view" hidden>
    <a class="rc-back" href="/tiers/?list">← 목록</a>
    <p class="rc-form-err" id="item-error" hidden></p>
    <div id="item-body"></div>
  </section>
</div>

</main>

<script type="module" src="/assets/tiers.js?v=12c0622f"></script>
</body>
</html>
