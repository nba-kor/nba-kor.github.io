<body>

<header class="top">
  <div class="brand">NBA 덩크 시티 <span>TNAB</span></div>
  <nav>
    <a href="/">홈</a>
    <a href="/tactics/">전술판</a>
    <a href="/tiers/">티어표</a>
    <a href="/combos/">조합표</a>
    <a href="/potentials/">잠재력추천</a>
    <a href="/videos/">영상</a>
    <a href="/recruit/">팀원모집</a>
  </nav>
  <div class="spacer"></div>
  <div class="rc-auth" id="auth" aria-live="polite"></div>
</header>

<main class="recruit pt vd">

  <!-- 올리기 · 고치기 — 로그인한 사람만 -->
  <section id="form-view" class="card rc-create" hidden>
    <form id="video-form" novalidate>
      <h2 id="form-title">영상 올리기</h2>
      <label class="rc-fld">
        <span>유튜브 주소</span>
        <input type="text" name="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://youtu.be/…  또는  https://www.youtube.com/watch?v=…" required>
        <small class="rc-hint">붙여 넣으면 제목이 자동으로 채워져요. 쇼츠 · 라이브 주소도 돼요</small>
      </label>
      <div class="vd-preview" id="form-preview" hidden></div>
      <label class="rc-fld">
        <span>제목</span>
        <input type="text" name="title" maxlength="60" autocomplete="off" required>
      </label>
      <fieldset>
        <legend>분류</legend>
        <div class="rc-seg-opts" id="form-cats"></div>
      </fieldset>
      <fieldset>
        <legend>나온 캐릭터 <small>선택 · 5명까지</small></legend>
        <div id="form-chars"></div>
      </fieldset>
      <label class="rc-fld">
        <span>설명 <small>선택</small></span>
        <textarea name="body" rows="3" maxlength="1000" placeholder="예) 픽앤롤에서 스크린 각도 잡는 법"></textarea>
      </label>
      <p class="rc-form-err" role="alert" hidden></p>
      <div class="rc-actions">
        <button type="button" id="form-cancel">취소</button>
        <button type="submit" class="primary rc-big">저장</button>
      </div>
    </form>
  </section>

  <!-- ?v 없음: 목록 -->
  <section id="list-view" hidden>
    <div class="rc-hero">
      <div>
        <h1>영상</h1>
        <p class="rc-lead">강의 · 하이라이트 · 공략 · 매드무비. 유튜브 링크만 붙여 넣으면 올라가요. 좋은 영상엔 추천을 눌러 주세요.</p>
        <p class="rc-muted rc-need" id="need" hidden></p>
      </div>
      <button id="new" class="primary rc-big" type="button">+ 영상 올리기</button>
    </div>
    <div class="card pt-filter">
      <div class="vd-cats" id="filter-cats" role="group" aria-label="분류"></div>
      <div class="pt-sort" role="group" aria-label="정렬">
        <button type="button" data-sort="likes">추천순</button>
        <button type="button" data-sort="new">최신순</button>
      </div>
      <div id="filter-chars"></div>
    </div>
    <div id="list" class="rc-list pt-list vd-list"></div>
  </section>

  <!-- ?v=<id>: 글 -->
  <section id="item-view" hidden>
    <a class="rc-back" href="/videos/">← 목록</a>
    <p class="rc-form-err" id="item-error" hidden></p>
    <div id="item-body"></div>
  </section>

</main>

<script type="module" src="/assets/videos.js?v=3ca3d75e"></script>
</body>
