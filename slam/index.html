<main class="slam">
  <h1>슈퍼 슬램 <small>5:5 오락실 농구 · 1P vs CPU · 3분</small></h1>
  <div class="slam-stage">
    <canvas id="slam" aria-label="슈퍼 슬램 게임 화면"></canvas>
    <div class="slam-pad">
      <div class="slam-stick" id="stick"><span></span></div>
      <div class="slam-btns">
        <button type="button" id="btn-a">패스<br><small>스틸</small></button>
        <button type="button" id="btn-b">슛<br><small>블록</small></button>
      </div>
    </div>
  </div>
  <p class="slam-help keys">이동 <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd>(WASD) · 패스 · 스틸 <kbd>Z</kbd>(J) · 슛 · 블록 <kbd>X</kbd>(K, 스페이스)</p>
  <p class="slam-help">골대 가까이에서 슛을 누르면 덩크. 패스는 방향키를 누른 쪽 동료에게 가요. 수비할 때 공에서 멀리서 패스 버튼을 누르면 공에 가까운 선수로 바뀌어요. 휴대폰은 가로로 돌리면 크게 보여요.</p>
