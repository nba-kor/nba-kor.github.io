<meta property="og:title" content="조합표 · NBA덩크시티-TNAB">
<meta property="og:description" content="NBA 덩크 시티 3:3 조합표. 선수 3명 조합과 추천 잠재력 · 상대하기 편한/힘든 캐릭터와 조합을 찾아보고 추천 · 댓글을 남기세요.">

</head>
<body>

<header class="top">
  <div class="brand">NBA 덩크 시티 <span>TNAB</span></div>
  <nav>
    <a href="/">홈</a>
    <a href="/tactics/">전술판</a>
    <a href="/tiers/">티어표</a>
    <a href="/combos/">조합표</a>
    <a href="/potentials/">잠재력추천</a>
    <a href="/videos/">영상</a>
    <a href="/recruit/">팀원모집</a>
  </nav>
  <div class="spacer"></div>
  <div class="rc-auth" id="auth" aria-live="polite"></div>
</header>

<main class="recruit pt cb">

  <!-- 글 쓰기 · 고치기 — 로그인한 사람만 -->
  <section id="form-view" class="card rc-create" hidden>
    <form id="combo-form" novalidate>
      <h2 id="form-title">조합 등록</h2>
      <label class="rc-fld">
        <span>조합 이름</span>
        <input type="text" name="title" maxlength="40" autocomplete="off" placeholder="예) 커리 · 그린 · 듀란트 스페이싱" required>
      </label>
      <fieldset>
        <legend>선수 3명 <small>누른 순서대로 1 · 2 · 3번</small></legend>
        <div id="form-chars"></div>
        <small class="rc-hint">선수마다 잠재력추천에 올라온 빌드를 골라 참고로 붙일 수 있어요(선택)</small>
        <div id="form-builds" class="cb-bpicks"></div>
      </fieldset>
      <fieldset>
        <legend>😀 상대하기 편한 캐릭터 · 조합 <small>선택 · 캐릭터 10명 · 조합(3명) 10개까지</small></legend>
        <div class="pt-sort" id="form-easy-mode" role="group" aria-label="고르는 것">
          <button type="button" value="chars">캐릭터 고르기</button>
          <button type="button" value="set">조합 만들기 (3명)</button>
        </div>
        <div id="form-easy-chars"></div>
        <div id="form-easy-combos" class="cb-sets"></div>
      </fieldset>
      <fieldset>
        <legend>😣 상대하기 힘든 캐릭터 · 조합 <small>선택 · 캐릭터 10명 · 조합(3명) 10개까지</small></legend>
        <div class="pt-sort" id="form-hard-mode" role="group" aria-label="고르는 것">
          <button type="button" value="chars">캐릭터 고르기</button>
          <button type="button" value="set">조합 만들기 (3명)</button>
        </div>
        <div id="form-hard-chars"></div>
        <div id="form-hard-combos" class="cb-sets"></div>
      </fieldset>
      <label class="rc-fld">
        <span>조합 설명 <small>선택</small></span>
        <textarea name="body" rows="4" maxlength="1000" placeholder="예) 커리가 볼을 들고 그린이 스크린, 듀란트는 코너에서 대기. 빅맨이 느린 조합에 강해요"></textarea>
      </label>
      <p class="rc-form-err" role="alert" hidden></p>
      <div class="rc-actions">
        <button type="button" id="form-cancel">취소</button>
        <button type="submit" class="primary rc-big">저장</button>
      </div>
    </form>
  </section>

  <!-- ?c 없음: 목록 -->
  <section id="list-view" hidden>
    <div class="rc-hero">
      <div>
        <h1>조합표</h1>
        <p class="rc-lead">3:3 선수 조합을 모았어요. 선수별 추천 잠재력 · 상대하기 편한/힘든 캐릭터와 조합을 같이 보고, 좋은 조합엔 추천을 남겨 주세요.</p>
        <p class="rc-muted rc-need" id="need" hidden></p>
      </div>
      <button id="new" class="primary rc-big" type="button">+ 조합 등록</button>
    </div>
    <div class="card pt-filter">
      <div class="pt-sort" role="group" aria-label="정렬">
        <button type="button" data-sort="likes">추천순</button>
        <button type="button" data-sort="new">최신순</button>
      </div>
      <div id="filter-chars"></div>
    </div>
    <div id="list" class="rc-list pt-list"></div>
  </section>

  <!-- ?c=<id>: 글 -->
  <section id="item-view" hidden>
    <a class="rc-back" href="/combos/">← 목록</a>
    <p class="rc-form-err" id="item-error" hidden></p>
    <div id="item-body"></div>
  </section>

</main>

<script type="module" src="/assets/combos.js?v=f480fe0c"></script>
</body>
</html>
