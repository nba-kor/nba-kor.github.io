<body>

<main class="home">

  <!-- 내 프로필 · 이번 주 아레나 — 로그인 상태에 따라 index.html 아래 스크립트가 채운다 -->
  <section class="me-card" id="me-card" aria-live="polite"><p class="rc-muted">로그인 확인 중…</p></section>

  <nav class="cats" aria-label="메뉴">
    <a class="cat" href="/arena/">
      <svg class="cat-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg><b>아레나 운영</b><small>아레나 신청 · 팀 편성 · 일정/결과</small>
    </a>
    <div class="cat">
      <a class="cat-main" href="/tactics/"><svg class="cat-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5c-1.8-1.4-4.6-2-8-2v14c3.4 0 6.2.6 8 2 1.8-1.4 4.6-2 8-2v-14c-3.4 0-6.2.6-8 2zM12 6.5v14"/></svg><b>전략·공략</b></a>
      <span class="cat-links"><a href="/tactics/">전술판</a><a href="/tiers/">티어표</a><a href="/combos/">조합표</a><a href="/potentials/">잠재력추천</a></span>
    </div>
    <a class="cat" href="/videos/">
      <svg class="cat-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="13.5" height="12" rx="2.5"/><path d="M16 10.5l5.5-3v9l-5.5-3"/></svg><b>영상 자료실</b><small>강의 영상 · 경기 영상 · 참고 자료</small>
    </a>
    <a class="cat" href="/me/">
      <svg class="cat-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c1.2-4 4.3-6 8-6s6.8 2 8 6"/></svg><b>마이페이지</b><small>프로필 · 등록 계정 · 보유 캐릭터 · 신청 이력</small>
    </a>
  </nav>

  <!-- 영상 게시판의 최신 "강의" — 없거나 API 가 안 되면 통째로 숨는다 -->
  <section class="lectures" id="lectures" hidden>
    <div class="lectures-head">
      <h3>최신 강의 영상</h3>
      <a href="/videos/?cat=lecture">더 보기 →</a>
    </div>
    <div class="lectures-grid" id="lectures-grid"></div>
  </section>

  <section class="roster-strip">
    <h3>한국 서버 출시 선수</h3>
    <div class="faces" id="faces"></div>
  </section>

  <p class="stamp"></p>
</main>

<script type="module">
import { faceOf, mountTop } from '/assets/app.js?v=915be0c5'
import { api, chooseLogin } from '/assets/auth.js?v=e2ffcda1'
import { h, P, loadData, data, startAuth, auth, me } from '/assets/board.js?v=3a1e630f'
import { accountsOf, charFaces, arenaCfg, weekLabel } from '/assets/profile.js?v=df837796'
await loadData()
mountTop('/', data.updatedAt)
const kr = data.players.filter(p => p.server === 'kr')
document.getElementById('faces').innerHTML = kr
  .map(p => `<img src="${p.img}" alt="${p.name}" title="${p.name}" loading="lazy">`).join('')

// 내 프로필 + 이번 주 아레나 신청 — 로그인 상태가 정해지거나 바뀔 때마다. 이름 · 닉네임은 사용자 입력이라 h() 로(글자로만) 넣는다
const A = await arenaCfg(), TAG = Object.fromEntries([...A.slots.map(s => [s.id, s.short]), ...A.extra.map(c => [c.id, c.label])])
let arena = null
async function paint() {
  const box = document.getElementById('me-card'), go = (href, label, cls = '') => h('a', { className: `btn ${cls}`, href }, label)
  if (auth === 'loading') return
  if (auth !== 'in') return box.replaceChildren(h('div', { className: 'me-main' },
    h('div', {}, h('b', {}, '내 프로필'), h('p', { className: 'rc-muted' }, '로그인하면 내 계정 · 캐릭터와 이번 주 아레나 신청 상태가 여기 보여요.')),
    h('button', { type: 'button', className: 'primary', onclick: chooseLogin }, '로그인')))
  const accts = accountsOf(me.profile?.entries), main = accts[0]
  arena ||= api('/arena').catch(() => null)
  const a = await arena, mine = a?.signups.find(s => s.userId === me.id)
  const at = a && Object.entries(a.plan).flatMap(([slot, teams]) => teams.flatMap((tm, i) => tm.some(x => x.u === me.id) ? [`${TAG[slot]} ${i + 1}팀`] : []))
  box.replaceChildren(
    h('div', { className: 'me-main' },
      main ? h('img', { src: faceOf(P(main.chars[0])), alt: '' }) : h('span', { className: 'rc-hole' }),
      h('div', {},
        h('b', {}, me.name, me.profile && h('span', { className: `rc-tag ${me.profile.mic ? 'mic-on' : 'mic-no'}` }, me.profile.mic ? '마이크 O' : '마이크 X')),
        main ? h('p', {}, h('span', { className: 'ac-kind is-main' }, '본계정'), ` ${main.nick} `, charFaces(main.chars, 5), accts.length > 1 && h('small', {}, ` 부계정 ${accts.length - 1}개`))
          : h('p', { className: 'rc-muted' }, '아직 프로필이 없어요 — 게임 계정과 캐릭터를 등록해 주세요')),
      go('/me/', main ? '마이페이지' : '프로필 만들기', main ? '' : 'primary')),
    a && h('div', { className: 'me-arena' },
      h('span', {}, h('b', {}, '이번 주 아레나'), ` ${weekLabel(a.week)}`),
      h('span', { className: `ar-state${mine ? ' is-on' : ''}` }, !mine ? '미신청' : mine.slots.includes('absent') ? '사유불참' : `신청 완료 · ${mine.slots.map(s => TAG[s]).join(' · ')}`),
      at?.length > 0 && h('span', { className: 'me-at' }, `배정 ${at.join(' · ')}`),
      go(mine ? '/arena/' : '/arena/#signup', mine ? '신청 · 편성 보기' : '신청하기', mine ? '' : 'primary')))
}
startAuth('', paint)   // 머리의 로그인 · 이름 줄 — 다른 페이지와 같다

// 최신 강의 4개. 제목 · 작성자는 사용자 입력이라 textContent 로만 넣는다
try {
  const { videos } = await api('/videos?cat=lecture&sort=new&limit=4')
  const grid = document.getElementById('lectures-grid')
  for (const v of videos) {
    const a = Object.assign(document.createElement('a'), { className: 'lecture', href: `/videos/?v=${v.id}` })
    a.innerHTML = `<div class="vd-thumb"><img src="https://i.ytimg.com/vi/${v.youtube}/mqdefault.jpg" alt="" loading="lazy"></div><b></b><small></small>`
    a.querySelector('b').textContent = v.title
    a.querySelector('small').textContent = v.author
    grid.append(a)
  }
  document.getElementById('lectures').hidden = !videos.length
} catch {}
</script>
