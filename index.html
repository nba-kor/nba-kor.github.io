      { g: '선수', t: '[일식의 그림자] 브룩 로페즈', s: '10-28', e: '10-28', img: '/assets/players/brook-lopez.png', d: ['10월 28일 대규모 업데이트로 신규 선수 출시.'], src: IG + 'De_RbzcFHf5/' },
      { g: '코스튬', t: '직판 코스튬 [사수자리]', s: '11-23', e: '12-21', ico: '🏹', d: ['신규 직판 코스튬 「사수자리」 출시.', '헤어스타일과 눈가 장식부터 장갑과 활·화살 모양의 등 장식까지.'], src: IG + 'DgEXWhSFFvF/' },

      { g: '코스튬', t: '행운의 보물찾기: [샌드 로즈]', s: '11-25', e: '12-08', img: 'sandrose', d: [], src: IG + 'Df6R6WClO1m/' },

      { g: '코스튬', t: '[카니발 스쿼드]', s: '11-25', e: '12-22', img: 'carnival', d: [], src: IG + 'DgHDEWylFiP/' },
      { g: '이벤트', t: '블랙 프라이데이 할인 · 교환 상점', s: '11-25', e: '12-06', ico: '🛍️', d: ['특별 패키지를 구매하고 더욱 풍성한 보상을 받아 보세요.', '특가 상품 구매 시 전용 토큰인 「블랙 프라이데이 영수증」을 획득할 수 있습니다.', '교환 보상: [허스키] 헤드웨어 · 블랙 카드 · 프로필 및 프로필 배경.'], src: IG + 'DgByjS3gPyR/' },
      { g: '이벤트', t: '누적 충전으로 좋은 선물 받기', s: '11-25', e: '12-06', ico: '🎁', d: ['누적 충전 금액에 따라 푸짐한 보상을 획득할 수 있습니다.'], src: IG + 'DgB5aErlMLJ/' },
      { g: '이벤트', t: '단돈 1,200원! 7일간 매일 특별 혜택', s: '11-25', e: '12-02', ico: '💸', d: ['7일간 매일 특별 혜택을 받는 특가 패키지.'], src: IG + 'DgG8HP1lHAI/' },

    ]
    const Y = 2026, day = s => new Date(`${Y}-${s}T00:00`), md = s => s.replace(/^0?(\d+)-0?(\d+)$/, '$1/$2')
    const pic = c => c.img.includes('/') ? c.img : `/assets/calendar/${c.img}.webp` // 이름만이면 assets/calendar/*.webp
    const when = c => c.s === c.e ? `${md(c.s)} 출시` : `${md(c.s)} – ${md(c.e)}`
    const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n }
    const dlg = document.getElementById('ev-dlg')
    // 상세: 일정 하나가 한 장. 묶인 막대면 여러 장을 옆으로 넘긴다(스와이프 · ‹ › · ← →) — CSS scroll-snap
    const track = dlg.querySelector('.ev-track'), count = dlg.querySelector('.ev-count')
    const slide = c => {
      const n = el('article', 'ev-slide')
      if (c.img) { const i = el('img'); i.src = pic(c); i.alt = ''; n.append(i) }
      const a = el('a', '', '공지 원문 보기'); a.href = c.src; a.target = '_blank'; a.rel = 'noopener'
      n.append(el('h3', '', c.t), el('p', 'ev-when', `${c.g} · ${when(c)}`),
        ...(c.d.length ? c.d : ['상세 보상 · 조건은 아직 공지 문구에 없어요. 게임 안이나 공지를 확인하세요.']).map(x => el('p', '', x)), el('p', 'ev-src'))
      n.lastChild.append(a); return n
    }
    const at = () => Math.round(track.scrollLeft / track.clientWidth)
    const show = () => { count.textContent = `${at() + 1} / ${track.children.length}` }
    track.onscroll = show
    dlg.querySelectorAll('[data-go]').forEach(b => b.onclick = () => track.scrollBy({ left: b.dataset.go * track.clientWidth, behavior: 'smooth' }))
    dlg.onkeydown = e => (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && track.scrollBy({ left: (e.key === 'ArrowLeft' ? -1 : 1) * track.clientWidth, behavior: 'smooth' })
    const open = c => {
      const l = c.items || [c]
      track.replaceChildren(...l.map(slide)); dlg.querySelector('.ev-nav').hidden = l.length < 2
      dlg.showModal(); track.scrollLeft = 0; show()
    }
    const clickable = (n, c) => { n.tabIndex = 0; n.setAttribute('role', 'button'); n.onclick = () => open(c); n.onkeydown = e => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), open(c)); return n }
    const today = new Date(); today.setHours(0, 0, 0, 0)
    // 달력: 한 주가 한 줄, 그 주에 걸친 일정은 날짜 칸 아래 막대(grid-column 으로 시작 ~ 끝 요일)
    const months = document.getElementById('cal-months')
    let cur = new Date(today.getFullYear(), today.getMonth(), 1) // 보이는 달, 처음엔 이번 달
    const render = () => {
      const Y = cur.getFullYear(), m = cur.getMonth()
      document.getElementById('cal-title').textContent = `${Y}년 ${m + 1}월`
      const box = el('div', 'cal-month')
      const head = el('div', 'cal-week cal-dow'); '일월화수목금토'.split('').forEach(w => head.append(el('span', '', w))); box.append(head)
      const first = new Date(Y, m, 1), last = new Date(Y, m + 1, 0)
      for (let ws = new Date(Y, m, 1 - first.getDay()); ws <= last; ws.setDate(ws.getDate() + 7)) {
        const we = new Date(ws); we.setDate(we.getDate() + 6)
        const row = el('div', 'cal-week')
        for (let i = 0; i < 7; i++) {
          const d = new Date(ws); d.setDate(d.getDate() + i)
          const n = el('span', 'cal-day' + (d.getMonth() !== m ? ' out' : '') + (+d === +today ? ' today' : ''), d.getMonth() === m ? d.getDate() : '')
          n.style.gridColumn = i + 1; row.append(n)
        }
        // ponytail: 막대는 그 달 안에서만 자른다 — 주가 두 달에 걸치면 각 달에 따로 그린다
        const lo = Math.max(+ws, +first), hi = Math.min(+we, +last)
        // 같은 구분 · 같은 기간은 막대 하나로(「첫 이름 외 N」) — 줄이 쓸데없이 늘지 않게
        const groups = new Map()
        CAL.filter(c => +day(c.s) <= hi && +day(c.e) >= lo).forEach(c => { const k = `${c.g}|${c.s}|${c.e}`; groups.has(k) ? groups.get(k).push(c) : groups.set(k, [c]) })
        ;[...groups.values()].map(l => l.length === 1 ? l[0] : { g: l[0].g, s: l[0].s, e: l[0].e, t: `${l[0].t} 외 ${l.length - 1}`, items: l }).forEach(c => {
          const a = new Date(Math.max(+day(c.s), lo)).getDay(), z = new Date(Math.min(+day(c.e), hi)).getDay()
          const bar = clickable(el('span', `cal-bar g-${c.g}`, c.t), c); bar.title = `${c.t} · ${when(c)}`
          bar.style.gridColumn = `${a + 1} / ${z + 2}`; row.append(bar)
        })
        box.append(row)
      }
      months.replaceChildren(box)
    }
    const go = n => { cur = new Date(cur.getFullYear(), cur.getMonth() + n, 1); render() }
    document.getElementById('cal-prev').onclick = () => go(-1); document.getElementById('cal-next').onclick = () => go(1)
    render()
    // 목록: 오늘 진행 중인 것만(시작일 ≤ 오늘 ≤ 끝일) — 그림 · 이름 · 기간
    const list = document.getElementById('cal-list')
    const now = CAL.filter(c => +day(c.s) <= +today && +today <= +day(c.e))
    if (!now.length) list.append(el('li', 'cal-none', '지금 진행 중인 일정이 없어요. 달력에서 지난 · 다가올 일정을 보세요.'))
    for (const c of now) {
      const li = clickable(el('li', `g-${c.g}`), c)
      if (c.img) { const i = el('img'); i.src = pic(c); i.alt = ''; i.loading = 'lazy'; li.append(i) } else li.append(el('b', 'ev-ico', c.ico))
      li.append(el('span', '', c.t), el('time', '', `${c.g} · ${when(c)}`)); list.append(li)
    }
  }

const kr = data.players.filter(p => p.server === 'kr')
document.getElementById('faces').innerHTML = kr
  .map(p => `<img src="${p.img}" alt="${p.name}" title="${p.name}" loading="lazy">`).join('')

// 내 프로필 + 이번 주 아레나 신청 — 로그인 상태가 정해지거나 바뀔 때마다. 이름 · 닉네임은 사용자 입력이라 h() 로(글자로만) 넣는다
const A = await arenaCfg(), TAG = Object.fromEntries([...A.slots, ...A.retired].map(s => [s.id, s.short]).concat(A.extra.map(c => [c.id, c.label])))
let arena = null
async function paint() {
  const box = document.getElementById('me-card'), go = (href, label, cls = '') => h('a', { className: `btn ${cls}`, href }, label)
  if (auth === 'loading') return
  if (auth !== 'in') return box.replaceChildren(h('div', { className: 'me-main' },
    h('div', {}, h('b', {}, '내 프로필'), h('p', { className: 'rc-muted' }, '로그인하면 내 계정 · 캐릭터와 이번 주 아레나 신청 상태가 여기 보여요.')),
    h('button', { type: 'button', className: 'primary', onclick: chooseLogin }, '로그인')))
  const accts = accountsOf(me.profile?.entries), main = accts[0]
  arena ||= api('/arena').catch(() => null)
  const a = await arena, mine = a?.signups.find(s => s.userId === me.id)
  const at = a && A.slots.flatMap(s => (a.plan[s.id] || []).flatMap((tm, i) => tm.some(x => x.u === me.id) ? [`${s.short} ${i + 1}팀`] : []))   // plan 에는 시간대 말고 done(팀 없이 완료) 도 있다
  box.replaceChildren(
    h('div', { className: 'me-main' },
      main ? h('img', { src: faceOf(P(main.chars[0])), alt: '' }) : h('span', { className: 'rc-hole' }),
      h('div', {},
        h('b', {}, me.name, me.profile && h('span', { className: `rc-tag ${me.profile.mic ? 'mic-on' : 'mic-no'}` }, me.profile.mic ? '마이크 O' : '마이크 X')),
        main ? h('p', {}, h('span', { className: 'ac-kind is-main' }, '본계정'), ` ${main.nick} `, charFaces(main.chars, 5), accts.length > 1 && h('small', {}, ` 부계정 ${accts.length - 1}개`))
          : h('p', { className: 'rc-muted' }, '아직 프로필이 없어요 — 게임 계정과 캐릭터를 등록해 주세요')),
      go('/me/', main ? '마이페이지' : '프로필 만들기', main ? '' : 'primary')),
    a && h('div', { className: 'me-arena' },
      h('span', {}, h('b', {}, '이번 주 아레나'), ` ${weekLabel(a.week)}`),
      h('span', { className: `ar-state${mine ? ' is-on' : ''}` }, !mine ? '미신청' : mine.slots.includes('absent') ? '사유불참' : `신청 완료 · ${mine.slots.map(s => TAG[s]).join(' · ')}`),
      at?.length > 0 && h('span', { className: 'me-at' }, `배정 ${at.join(' · ')}`),
      go(mine ? '/arena/' : '/arena/#signup', mine ? '신청 · 편성 보기' : '신청하기', mine ? '' : 'primary')))
}
startAuth('', paint)   // 머리의 로그인 · 이름 줄 — 다른 페이지와 같다

// 최신 강의 4개. 제목 · 작성자는 사용자 입력이라 textContent 로만 넣는다
try {
  const { videos } = await api('/videos?cat=lecture&sort=new&limit=4')
  const grid = document.getElementById('lectures-grid')
  for (const v of videos) {
    const a = Object.assign(document.createElement('a'), { className: 'lecture', href: `/videos/?v=${v.id}` })
    a.innerHTML = `<div class="vd-thumb"><img src="https://i.ytimg.com/vi/${v.youtube}/mqdefault.jpg" alt="" loading="lazy"></div><b></b><small></small>`
    a.querySelector('b').textContent = v.title
    a.querySelector('small').textContent = v.author
    grid.append(a)
  }
  document.getElementById('lectures').hidden = !videos.length
} catch {}
</script>
</body>
</html>
